<!DOCTYPE html>
<html lang="en">
<head>

    <style>
        body {
            background: #2f2f2f;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 40px;
        }

        img.logo {
            width: 150px;
            margin-bottom: 20px;

        }

        h1 {
            font-size: 42px;

            /* Gradient */
            background: linear-gradient(90deg, #4aa8ff, #b36cff);
            color: transparent;

            /* Chrome / Edge / Safari / Opera */
            -webkit-background-clip: text;
            background-clip: text;

            /* FIREFOX MAGIC — makes gradient work perfectly */
            -webkit-mask-image: linear-gradient(#fff 0 0);
            mask-image: linear-gradient(#fff 0 0);
        }

        .thank-box {
            background: #3a3a3a;
            padding: 20px;
            margin: 20px auto;
            width: 75%;
            border-radius: 12px;
            border: 2px solid #b36cff;
        }

        .button {
            display: inline-block;
            margin: 15px;
            padding: 12px 25px;
            background: linear-gradient(90deg, #4aa8ff, #b36cff);
            color: black;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.2s;
        }

        .button:hover {
            background: linear-gradient(90deg, #2f7ed6, #8a4ad6);
        }
    </style>
</head>
