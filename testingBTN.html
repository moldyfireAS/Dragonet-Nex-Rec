<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Button Test</title>

<style>
  button,
  .btn,
  a.btn {
    appearance: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 44px;
    padding: 11px 18px;
    border: 1px solid transparent;
    border-radius: 999px;
    background: linear-gradient(135deg, #512BD4, #4F6BED, #0099FF);
    color: white;
    font: inherit;
    font-weight: 750;
    text-decoration: none;
    cursor: pointer;
    transition:
      transform 160ms ease,
      box-shadow 160ms ease,
      filter 160ms ease;
  }

  button:hover,
  .btn:hover,
  a.btn:hover {
    transform: translateY(-4px) scale(1.03);
    filter: brightness(1.3);
    box-shadow: 0 18px 40px rgba(123, 97, 255, 0.35);
  }

  button:active,
  .btn:active,
  a.btn:active {
    transform: translateY(0);
  }

  body {
    font-family: Segoe UI, sans-serif;
    padding: 40px;
    background: #f2f2f2;
  }
</style>

</head>
<body>
<h2>Button Hover Test</h2>

<button class="btn">Test Button</button>
<br><br>
<a class="btn">Test Link Button</a>

</body>
</html>
