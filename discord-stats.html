<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Server Stats</title>
  <link rel="stylesheet" href="/style.css">
 <link rel="icon" type="image/png" href="icon.png">
</head><body class="chaos-outline">

  <h1>Server Stats</h1>

  <div class="stat-box">
    <h2>Total novas</h2>
    <p id="total">Loading...</p>
  </div>

  <div class="stat-box">
    <h2>Online novas</h2>
    <p id="online">Loading...</p>
  </div>

  <script>
    async function loadStats() {
      const res = await fetch("/stats");
      const data = await res.json();

      document.getElementById("total").textContent = data.total_members;
      document.getElementById("online").textContent = data.online_members;
    }

    loadStats();
  </script>
<div><a href="index.html">go home</a></div>

    <p>N3XI0M</p>
  </footer>
</body>
</html>
