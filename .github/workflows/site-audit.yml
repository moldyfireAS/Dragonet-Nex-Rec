name: Site Audit

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Verify asset cache versions
        run: python scripts/update_asset_versions.py --check

      - name: Validate incident configuration
        run: python scripts/validate_incident.py

      - name: Validate changelog
        run: python scripts/validate_changelog.py

      - name: Audit site
        run: python scripts/audit_site.py

      - name: Check JavaScript syntax
        run: |
          node --check functions/stats.js
          node --check functions/health.js
          node --check functions/_middleware.js

      - name: Check performance budgets
        run: python scripts/perf_audit.py
