name: Bug report
description: Report a reproducible problem with the N3XI0M website.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem with N3XI0M.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem clearly.
      placeholder: Explain what you expected and what happened instead.
    validations:
      required: true

  - type: input
    id: page
    attributes:
      label: Page
      placeholder: https://dragonet-recnet.pages.dev/...

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open...
        2. Click...
        3. See...
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Browser / device
      placeholder: Chrome 140, Android 16, Windows 11, etc.

  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or logs
      description: Add screenshots, console output, or other useful evidence.

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I checked that this issue has not already been reported.
          required: true
        - label: I am not including passwords, tokens, or private credentials.
          required: true
