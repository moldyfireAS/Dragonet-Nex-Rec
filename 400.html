<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>400 — Bad Request</title>

<style>
  body {
    background: black;
    color: #00ff99;
    font-family: "Courier New", monospace;
    overflow: hidden;
    margin: 0;
    padding: 0;
  }

  .tv {
    width: 600px;
    height: 400px;
    margin: 80px auto;
    background: #111;
    border: 12px solid #222;
    border-radius: 20px;
    box-shadow: 0 0 40px #0f0;
    position: relative;
    overflow: hidden;
  }

  .scanline {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: repeating-linear-gradient(
      to bottom,
      rgba(0,255,100,0.05) 0px,
      rgba(0,255,100,0.05) 2px,
      transparent 2px,
      transparent 4px
    );
    animation: scan 0.2s linear infinite;
    pointer-events: none;
  }

  @keyframes scan {
    0% { transform: translateY(-4px); }
    100% { transform: translateY(4px); }
  }

  .glitch {
    font-size: 32px;
    text-align: center;
    margin-top: 140px;
    text-shadow:
      2px 2px #0f0,
      -2px -2px #f00;
    animation: glitch 0.15s infinite;
  }

  @keyframes glitch {
    0% { transform: translate(0,0); }
    20% { transform: translate(-2px, 2px); }
    40% { transform: translate(2px, -2px); }
    60% { transform: translate(-3px, 1px); }
    80% { transform: translate(3px, -1px); }
    100% { transform: translate(0,0); }
  }

  .static {
    position: absolute;
    width: 100%;
    height: 100%;
    background: url("https://upload.wikimedia.org/wikipedia/commons/3/3f/Static.gif");
    background-size: cover;
    opacity: 0.15;
    mix-blend-mode: screen;
    pointer-events: none;
  }
</style>
</head>

<body>
  <div class="tv">
    <div class="static"></div>
    <div class="scanline"></div>
    <div class="glitch">400 — BAD REQUEST</div>
  </div>
</body>
</html>
